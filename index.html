<!DOCTYPE html>
<html>

<head>
<title>Smart House Predictor</title>

<style>

body{
font-family:'Segoe UI';
background: linear-gradient(135deg,#141e30,#243b55);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
color:white;
}

.container{
background: rgba(255,255,255,0.1);
backdrop-filter: blur(12px);
padding:35px;
border-radius:20px;
width:420px;
text-align:center;
box-shadow:0px 20px 50px rgba(0,0,0,0.5);
}

.navbar{
display:flex;
justify-content:space-between;
margin-bottom:15px;
font-size:14px;
}

.navbar a{
text-decoration:none;
margin-left:10px;
}

.history{
color:#00ffcc;
}

.logout{
color:#ff4d4d;
}

input{
width:90%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;
}

button{
background: linear-gradient(to right,#00c6ff,#0072ff);
border:none;
padding:12px 25px;
color:white;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.result{
margin-top:15px;
font-size:26px;
color:#00ffcc;
font-weight:bold;
}

.range{
margin-top:10px;
font-size:18px;
color:#f1c40f;
}

img{
margin-top:15px;
width:100%;
border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<!-- 🔥 NAVBAR -->
<div class="navbar">
<span>👋 Welcome</span>
<div>
<a href="/history" class="history">📜 History</a>
<a href="/logout" class="logout">🚪 Logout</a>
</div>
</div>

<h2>🏠 Smart House Predictor</h2>

<form action="/predict" method="post">

<input type="number" name="area" placeholder="Area (sqft)" required>
<input type="number" name="bedrooms" placeholder="Bedrooms" required>
<input type="number" name="bathrooms" placeholder="Bathrooms" required>
<input type="number" name="garage" placeholder="Garage" required>

<button type="submit">Predict</button>

</form>

<!-- 🔥 RESULT -->
<div class="result">
{{prediction_text}}
</div>

<div class="range">
{{range_text}}
</div>

<!-- 🔥 GRAPH -->
{% if show_graph %}
<img src="{{ url_for('static', filename='user_graph.png') }}">
{% endif %}

</div>

</body>

</html>
